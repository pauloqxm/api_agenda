<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Agenda Semanal</title>

<style>
:root{
  --bg:#0a1628;
  --card:#0f213d;
  --muted:#8eaad6;
  --text:#eaf2ff;
  --accent:#3b82f6;
  --line:rgba(59,130,246,.18);
  --shadow:0 14px 40px rgba(0,0,0,.35);
  --radius:20px;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:
    radial-gradient(900px 450px at 10% -10%, rgba(59,130,246,.25), transparent 60%),
    linear-gradient(180deg, #071224 0%, #0a1628 70%, #071224 100%);
  color:var(--text);
  min-height:100vh;
}

.wrap{
  max-width:1100px;
  margin:0 auto;
  padding:22px 14px 40px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:14px;
  padding:14px 16px;
  border:1px solid var(--line);
  background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
  border-radius:22px;
  box-shadow:var(--shadow);
}

.title h1{margin:0;font-size:18px}
.title small{color:var(--muted);font-size:12px}

.controls{display:flex;gap:10px;flex-wrap:wrap}

select,button{
  border-radius:14px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.06);
  color:var(--text);
  padding:10px 12px;
  font-size:14px;
}

.btnAccent{
  background:linear-gradient(180deg,#3b82f6,#2563eb);
  border-color:rgba(59,130,246,.35);
  color:#fff;
}

.range{
  margin:14px 2px 10px;
  color:var(--muted);
  font-size:13px;
  display:flex;
  justify-content:space-between;
}

.grid{
  display:grid;
  grid-template-columns:1fr;
  gap:16px;
}

@media (min-width:860px){
  .grid{grid-template-columns:1fr 1fr}
}

.card{
  border:1px solid var(--line);
  background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
  border-radius:var(--radius);
  padding:16px;
  box-shadow:var(--shadow);
  position:relative;
  transition:.25s ease;
}

.card:hover{
  transform:translateY(-4px);
  box-shadow:0 20px 55px rgba(0,0,0,.45);
}

.card::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:5px;
  background:linear-gradient(180deg,#3b82f6,rgba(59,130,246,.35));
  border-top-left-radius:var(--radius);
  border-bottom-left-radius:var(--radius);
}

.mainTitle{
  font-size:17px;
  font-weight:900;
  margin:0 0 8px 8px;
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  padding-left:8px;
}

.pill{
  font-size:12px;
  padding:6px 10px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.08);
}

.details{
  margin-top:12px;
  padding-left:8px;
  font-size:13px;
  line-height:1.6;
  color:rgba(234,242,255,.9);
}

.details strong{
  color:var(--accent);
}

.empty{
  border:1px dashed rgba(255,255,255,.2);
  border-radius:var(--radius);
  padding:18px;
  background:rgba(255,255,255,.03);
}
</style>
</head>

<body>
<div class="wrap">

<div class="top">
  <div class="title">
    <h1>Agenda Semanal</h1>
    <small>Semana fixa de segunda a domingo</small>
  </div>

  <div class="controls">
    <select id="selCong">
      <option value="">Todas Congregações</option>
    </select>
    <button class="btnAccent" id="btnAtualizar">Atualizar</button>
  </div>
</div>

<div class="range">
  <div>Período</div>
  <div id="rangeTxt">carregando…</div>
</div>

<div id="grid" class="grid"></div>

</div>

<script>
const API_BASE="https://api-agenda.up.railway.app";
const $=(id)=>document.getElementById(id);

function isoDate(d){return d.toISOString().split("T")[0];}

function getMonday(d){
  const x=new Date(d);
  const day=x.getDay();
  const diff=(day===0?-6:1-day);
  x.setDate(x.getDate()+diff);
  x.setHours(0,0,0,0);
  return x;
}

function fmtBR(date){return new Date(date).toLocaleDateString("pt-BR");}

function fmtHour(iso){
  const d=new Date(iso);
  const hh=String(d.getHours()).padStart(2,"0");
  const mm=String(d.getMinutes()).padStart(2,"0");
  return (hh==="00"&&mm==="00")?"":hh+":"+mm;
}

function renderCards(list){
  const grid=$("grid");
  grid.innerHTML="";
  if(!list.length){
    grid.innerHTML='<div class="empty">Sem eventos nessa semana.</div>';
    return;
  }

  list.forEach(ev=>{
    const ex=ev.extendedProps||{};
    const dirigentes=[ex.dirigente1,ex.dirigente2,ex.dirigente3].filter(Boolean).join(", ");

    const card=document.createElement("div");
    card.className="card";

    card.innerHTML=`
      <div class="mainTitle">${ev.title}</div>

      <div class="meta">
        <div class="pill">${fmtBR(ev.start)} ${fmtHour(ev.start)}</div>
        ${ex.congregacao?`<div class="pill">${ex.congregacao}</div>`:""}
        ${ex.turma_ebd?`<div class="pill">EBD ${ex.turma_ebd}</div>`:""}
      </div>

      <div class="details">
        ${ex.tipo?`<div><strong>Tipo:</strong> ${ex.tipo}</div>`:""}
        ${ex.subtipo?`<div><strong>Subtipo:</strong> ${ex.subtipo}</div>`:""}
        ${dirigentes?`<div><strong>Dirigentes:</strong> ${dirigentes}</div>`:""}
        ${ex.observacoes?`<div><strong>Obs:</strong> ${ex.observacoes}</div>`:""}
      </div>
    `;

    grid.appendChild(card);
  });
}

async function loadCong(){
  const r=await fetch(API_BASE+"/congregacoes");
  const data=await r.json();
  data.congregacoes.forEach(c=>{
    const o=document.createElement("option");
    o.value=c;
    o.textContent=c;
    $("selCong").appendChild(o);
  });
}

async function loadWeek(){
  const now=new Date();
  const start=getMonday(now);
  const end=new Date(start);
  end.setDate(end.getDate()+7);

  const dom=new Date(start);
  dom.setDate(dom.getDate()+6);

  $("rangeTxt").textContent=`${fmtBR(start)} até ${fmtBR(dom)}`;

  const url=new URL(API_BASE+"/calendario");
  url.searchParams.set("start",isoDate(start));
  url.searchParams.set("end",isoDate(end));
  if($("selCong").value){
    url.searchParams.set("congregacao",$("selCong").value);
  }

  const r=await fetch(url);
  const list=await r.json();
  renderCards(list);
}

$("btnAtualizar").onclick=loadWeek;
$("selCong").onchange=loadWeek;

(async function(){
  await loadCong();
  await loadWeek();
})();
</script>

</body>
</html>
