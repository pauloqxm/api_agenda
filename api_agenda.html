<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Agenda Semanal</title>

<style>
:root{
  --bg:#0a1628;
  --card:#0f213d;
  --card2:#12284a;
  --muted:#8eaad6;
  --text:#eaf2ff;
  --accent:#3b82f6;
  --line:rgba(59,130,246,.18);
  --shadow:0 14px 40px rgba(0,0,0,.35);
  --radius:18px;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:
    radial-gradient(900px 450px at 10% -10%, rgba(59,130,246,.25), transparent 60%),
    radial-gradient(900px 450px at 90% 10%, rgba(37,99,235,.25), transparent 60%),
    linear-gradient(180deg, #071224 0%, #0a1628 70%, #071224 100%);
  color:var(--text);
  min-height:100vh;
}

.wrap{
  max-width:1100px;
  margin:0 auto;
  padding:22px 14px 40px;
}

.top{
  display:flex;
  gap:14px;
  align-items:center;
  justify-content:space-between;
  padding:14px 16px;
  border:1px solid var(--line);
  background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
  border-radius:22px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(10px);
}

.brand{
  display:flex;
  gap:12px;
  align-items:center;
}

.logo{
  width:44px;
  height:44px;
  border-radius:14px;
  background:
    radial-gradient(circle at 30% 30%, rgba(59,130,246,.9), rgba(59,130,246,.15) 55%, transparent 60%),
    linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.15);
  display:grid;
  place-items:center;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}

.title h1{
  margin:0;
  font-size:18px;
}

.title small{
  color:var(--muted);
  font-size:12px;
}

.controls{
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
}

select,button{
  border-radius:14px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.06);
  color:var(--text);
  padding:10px 12px;
  font-size:14px;
}

.btnAccent{
  background:linear-gradient(180deg,#3b82f6,#2563eb);
  border-color:rgba(59,130,246,.35);
  color:#fff;
  box-shadow:0 14px 40px rgba(59,130,246,.25);
}

.btnAccent:hover{
  background:linear-gradient(180deg,#60a5fa,#3b82f6);
}

.range{
  margin:14px 2px 10px;
  color:var(--muted);
  font-size:13px;
  display:flex;
  justify-content:space-between;
}

.grid{
  display:grid;
  grid-template-columns:1fr;
  gap:14px;
}

.card{
  border:1px solid var(--line);
  background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
  border-radius:var(--radius);
  padding:14px;
  box-shadow:var(--shadow);
  position:relative;
}

.card::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:5px;
  background:linear-gradient(180deg,#3b82f6,rgba(59,130,246,.35));
}

.mainTitle{
  font-size:16px;
  font-weight:800;
  margin:0 0 8px 8px;
}

.meta{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  padding-left:8px;
}

.pill{
  font-size:12px;
  padding:6px 10px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.08);
}

.desc{
  margin:10px 0 0;
  padding-left:8px;
  font-size:13px;
  line-height:1.5;
}

.desc span{
  font-weight:700;
  color:var(--accent);
}

.empty{
  border:1px dashed rgba(255,255,255,.2);
  border-radius:var(--radius);
  padding:18px;
  background:rgba(255,255,255,.03);
}

@media (min-width:860px){
  .grid{grid-template-columns:1fr 1fr}
}
</style>
</head>

<body>
<div class="wrap">

<div class="top">
  <div class="brand">
    <div class="logo"></div>
    <div class="title">
      <h1>Agenda Semanal</h1>
      <small>Semana fixa de segunda a domingo</small>
    </div>
  </div>

  <div class="controls">
    <select id="selCong">
      <option value="">Todas Congregações</option>
    </select>
    <button class="btnAccent" id="btnAtualizar">Atualizar</button>
  </div>
</div>

<div class="range">
  <div>Período</div>
  <div id="rangeTxt">carregando…</div>
</div>

<div id="grid" class="grid"></div>

</div>

<script>
const API_BASE="https://api-agenda.up.railway.app";
const $=(id)=>document.getElementById(id);

function isoDate(d){return d.toISOString().split("T")[0];}

function getMonday(d){
  const x=new Date(d);
  const day=x.getDay();
  const diff=(day===0?-6:1-day);
  x.setDate(x.getDate()+diff);
  x.setHours(0,0,0,0);
  return x;
}

function fmtBR(date){return new Date(date).toLocaleDateString("pt-BR");}

function fmtHour(iso){
  const d=new Date(iso);
  const hh=String(d.getHours()).padStart(2,"0");
  const mm=String(d.getMinutes()).padStart(2,"0");
  return (hh==="00"&&mm==="00")?"":hh+":"+mm;
}

function renderCards(list){
  const grid=$("grid");
  grid.innerHTML="";
  if(!list.length){
    grid.innerHTML='<div class="empty">Sem eventos nessa semana.</div>';
    return;
  }

  list.forEach(ev=>{
    const ex=ev.extendedProps||{};
    const card=document.createElement("div");
    card.className="card";

    const title=document.createElement("div");
    title.className="mainTitle";
    title.textContent=ev.title;

    const meta=document.createElement("div");
    meta.className="meta";
    meta.innerHTML=`
      <div class="pill">${fmtBR(ev.start)} ${fmtHour(ev.start)}</div>
      ${ex.congregacao?`<div class="pill">${ex.congregacao}</div>`:""}
      ${ex.turma_ebd?`<div class="pill">EBD ${ex.turma_ebd}</div>`:""}
    `;

    const desc=document.createElement("div");
    desc.className="desc";
    desc.innerHTML=`
      ${ex.tipo?`<span>Tipo</span> ${ex.tipo}<br>`:""}
      ${ex.subtipo?`<span>Subtipo</span> ${ex.subtipo}<br>`:""}
      ${(ex.dirigente1||ex.dirigente2||ex.dirigente3)?
        `<span>Dirigentes</span> ${[ex.dirigente1,ex.dirigente2,ex.dirigente3].filter(Boolean).join(", ")}<br>`:""}
      ${ex.observacoes?`<span>Obs</span> ${ex.observacoes}`:""}
    `;

    card.appendChild(title);
    card.appendChild(meta);
    card.appendChild(desc);
    grid.appendChild(card);
  });
}

async function loadCong(){
  const r=await fetch(API_BASE+"/congregacoes");
  const data=await r.json();
  data.congregacoes.forEach(c=>{
    const o=document.createElement("option");
    o.value=c;
    o.textContent=c;
    $("selCong").appendChild(o);
  });
}

async function loadWeek(){
  const now=new Date();
  const start=getMonday(now);
  const end=new Date(start);
  end.setDate(end.getDate()+7);
  const dom=new Date(start);
  dom.setDate(dom.getDate()+6);
  $("rangeTxt").textContent=`${fmtBR(start)} até ${fmtBR(dom)}`;

  const url=new URL(API_BASE+"/calendario");
  url.searchParams.set("start",isoDate(start));
  url.searchParams.set("end",isoDate(end));
  if($("selCong").value){
    url.searchParams.set("congregacao",$("selCong").value);
  }

  const r=await fetch(url);
  const list=await r.json();
  renderCards(list);
}

$("btnAtualizar").onclick=loadWeek;
$("selCong").onchange=loadWeek;

(async function(){
  await loadCong();
  await loadWeek();
})();
</script>

</body>
</html>
